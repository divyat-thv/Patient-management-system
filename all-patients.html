<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All Patients — Ayushman Patient Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .filters {
      display: flex; gap: 10px; flex-wrap: wrap;
      align-items: center; margin-bottom: 16px;
    }
    .filters select {
      width: auto; padding: 8px 12px; font-size: 0.88rem;
    }
    .count-tag {
      font-size: 0.82rem; color: var(--muted); font-weight: 600;
      margin-left: 4px;
    }
    .table-actions { display: flex; gap: 6px; }
    .patient-row td:first-child { font-size: 0.78rem; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
      <span class="topbar-title" id="topbarTitle">Ayushman</span>
    </div>
    <span class="topbar-user" id="topbarUser"></span>
  </header>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawerNav"></nav>

  <main class="main-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div>
        <h1>👥 All Patients</h1>
        <p>Complete list of registered patients</p>
      </div>
      <a href="add-patient.html" class="btn btn-primary" style="margin-top:4px;">➕ Add Patient</a>
    </div>

    <!-- Search + Filters -->
    <div class="card" style="padding:16px 20px;margin-bottom:16px;">
      <div class="search-bar" style="margin-bottom:12px;">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name, mobile, patient ID or village…">
      </div>
      <div class="filters">
        <select id="filterGender">
          <option value="">All Genders</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <select id="filterVisit">
          <option value="">All Visit Types</option>
          <option value="New">New</option>
          <option value="Follow-up">Follow-up</option>
          <option value="Emergency">Emergency</option>
        </select>
        <select id="filterSort">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="name">Name A–Z</option>
        </select>
        <span class="count-tag" id="countTag">0 patients</span>
      </div>
    </div>

    <!-- Patient Table -->
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="patientTable"></div>
    </div>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/patients.js"></script>
  <script src="../js/app.js"></script>
  <script>
    Auth.requireAuth();
    initNav('patients');

    function render() {
      const q        = document.getElementById('searchInput').value.trim();
      const gFilter  = document.getElementById('filterGender').value;
      const vFilter  = document.getElementById('filterVisit').value;
      const sort     = document.getElementById('filterSort').value;

      let list = q ? Patients.searchPatients(q) : Patients.getPatients();
      if (gFilter) list = list.filter(p => p.gender === gFilter);
      if (vFilter) list = list.filter(p => p.visitType === vFilter);

      if (sort === 'oldest') list = [...list].reverse();
      else if (sort === 'name') list = [...list].sort((a,b) => a.name.localeCompare(b.name));

      document.getElementById('countTag').textContent = `${list.length} patient${list.length !== 1 ? 's' : ''}`;

      const container = document.getElementById('patientTable');
      if (!list.length) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🌱</div>
          <p>${q ? 'No patients match your search.' : 'No patients added yet.'}</p>
          ${!q ? `<a href="add-patient.html" style="color:var(--primary);font-weight:600;display:inline-block;margin-top:8px;">Add first patient →</a>` : ''}</div>`;
        return;
      }

      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Patient ID</th>
              <th>Name</th>
              <th>Age / Gender</th>
              <th>Mobile</th>
              <th>Village / Area</th>
              <th>Complaint</th>
              <th>Visit</th>
              <th>Added</th>
              <th>Actions</th>
            </tr></thead>
            <tbody>
              ${list.map(p => `
                <tr class="patient-row">
                  <td><span class="badge badge-green" style="font-size:0.7rem;">${escHtml(p.id)}</span></td>
                  <td style="font-weight:600;white-space:nowrap;">${escHtml(p.name)}</td>
                  <td>${escHtml(p.age||'—')} / ${escHtml(p.gender||'—')}</td>
                  <td style="white-space:nowrap;">📱 ${escHtml(p.mobile||'—')}</td>
                  <td style="color:var(--muted);font-size:0.85rem;">${escHtml(p.village||p.district||'—')}</td>
                  <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.84rem;color:var(--muted);" title="${escHtml(p.chiefComplaint||'')}">
                    ${p.chiefComplaint ? escHtml(p.chiefComplaint.slice(0,40)) + (p.chiefComplaint.length > 40 ? '…' : '') : '—'}
                  </td>
                  <td>${p.visitType ? `<span class="badge ${p.visitType==='New'?'badge-green':p.visitType==='Emergency'?'badge-pink':'badge-blue'}">${escHtml(p.visitType)}</span>` : '—'}</td>
                  <td style="color:var(--muted);font-size:0.8rem;white-space:nowrap;">${new Date(p.createdAt).toLocaleDateString('en-IN')}</td>
                  <td>
                    <div class="table-actions">
                      <a href="patient-detail.html?id=${encodeURIComponent(p.id)}" class="btn btn-outline btn-sm">View</a>
                      <button class="btn btn-danger btn-sm" onclick="confirmDelete('${escHtml(p.id)}','${escHtml(p.name)}')">Del</button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function confirmDelete(id, name) {
      if (confirm(`Delete patient "${name}" (${id})?\nThis action cannot be undone.`)) {
        Patients.deletePatient(id);
        render();
      }
    }

    // Live search + filters
    ['searchInput','filterGender','filterVisit','filterSort'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
      document.getElementById(id).addEventListener('change', render);
    });

    render();
  </script>
</body>
</html>
